spring.application.name=excelexport

# Use the local profile by default so your private settings load automatically
spring.profiles.active=local

# MySQL connection (username and password come from application-local.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/excel_export?rewriteBatchedStatements=true&serverTimezone=UTC

# Run schema.sql at startup to create the table
spring.sql.init.mode=always

# Export settings (read by ExportProperties later)
export.batch-size=10000
export.max-threads=1
export.max-concurrent-exports=1
export.window-size=100

spring.datasource.username=root
spring.datasource.password=123123

